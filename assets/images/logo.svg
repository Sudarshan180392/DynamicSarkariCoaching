<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Outer Shield / Hexagon -->
    <path d="M32 0 L60 12 L60 44 C60 56 46 63 32 66 C18 63 4 56 4 44 L4 12 Z" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Sunburst / Chakra Rays in Background -->
    <circle cx="32" cy="28" r="14" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.6"/>
    
    <!-- Torch of Victory / Flame -->
    <path d="M32 14 C34 18 36 21 34 24 C33 26 31 27 32 29 C30 27 29 25 30 23 C31 20 30 17 32 14 Z" fill="url(#goldGrad)"/>
    
    <!-- Open Book of Knowledge -->
    <path d="M20 44 C25 41 30 42 32 45 C34 42 39 41 44 44 L44 32 C39 29 34 30 32 33 C30 30 25 29 20 32 Z" fill="#FFFFFF"/>
    <path d="M32 33 L32 45" stroke="#1E3A8A" stroke-width="1.5"/>
    
    <!-- 3 Stars representing 3 Punjab Centers (Ludhiana, Jalandhar, Jagraon) -->
    <path d="M22 52 L23 54 L25 54 L23.5 55.5 L24 57.5 L22 56 L20 57.5 L20.5 55.5 L19 54 L21 54 Z" fill="#F59E0B"/>
    <path d="M32 54 L33 56 L35 56 L33.5 57.5 L34 59.5 L32 58 L30 59.5 L30.5 57.5 L29 56 L31 56 Z" fill="#F59E0B"/>
    <path d="M42 52 L43 54 L45 54 L43.5 55.5 L44 57.5 L42 56 L40 57.5 L40.5 55.5 L39 54 L41 54 Z" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 12)">
    <!-- DYNAMIC -->
    <text x="0" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" fill="#0F172A" letter-spacing="1.5">
      DYNAMIC
    </text>
    
    <!-- Accent Line -->
    <rect x="0" y="32" width="225" height="2" fill="url(#goldGrad)" rx="1"/>

    <!-- SARKARI COACHING -->
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13.5" fill="#D97706" letter-spacing="3.2">
      SARKARI COACHING
    </text>

    <!-- Tagline / Punjab Centers Indicator -->
    <text x="0" y="60" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#64748B" letter-spacing="0.5">
      LUDHIANA • JALANDHAR • JAGRAON
    </text>
  </g>
</svg>